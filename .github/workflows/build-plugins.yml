name: Build plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin folder to build (e.g. 2gis, sdk). Empty builds every plugin.'
        required: false
        default: ''
        type: string
      release:
        description: 'Also publish the bundles as a GitHub release'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-plugins-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugins
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          bun scripts/pack-release.ts $PLUGIN
          ls -l release

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: entinygram-plugins
          path: release/*.inu.js
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.release == true || inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="plugins-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" release/*.inu.js \
            --title "$tag" \
            --notes "Plugin bundles built from ${GITHUB_SHA::7}"
