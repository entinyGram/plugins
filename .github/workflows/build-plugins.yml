name: Build plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin folder to build (e.g. 2gis, sdk). Empty builds every plugin.'
        required: false
        default: ''
        type: string
      release:
        description: 'Also put the bundles in the single "plugins" GitHub release (files are replaced, no new release is created)'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-plugins-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build plugins
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          bun scripts/pack-release.ts $PLUGIN
          ls -l release

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: entinygram-plugins
          path: release/*.inu.js
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.release == true || inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: plugins
        run: |
          notes="Plugin bundles, last built from ${GITHUB_SHA::7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a plugin with a new version replaces its old file instead of piling up next to it
            for file in release/*.inu.js; do
              keep=$(basename "$file")
              prefix=$(echo "$keep" | sed -E 's/-[0-9]+\.[0-9][0-9A-Za-z.+-]*\.inu\.js$//')
              for name in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
                old=$(echo "$name" | sed -E 's/-[0-9]+\.[0-9][0-9A-Za-z.+-]*\.inu\.js$//')
                if [ "$old" = "$prefix" ] && [ "$name" != "$keep" ]; then
                  gh release delete-asset "$TAG" "$name" --yes
                fi
              done
            done
            gh release upload "$TAG" release/*.inu.js --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" release/*.inu.js --title "entinyGram plugins" --notes "$notes"
          fi
